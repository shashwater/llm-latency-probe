[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-latency-probe"
version = "0.1.0"
description = "Benchmark TTFT and tokens/sec across OpenAI-compatible LLM inference endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "rich>=13"]

[project.scripts]
llm-latency-probe = "llm_latency_probe.cli:main"

[tool.setuptools.packages.find]
include = ["llm_latency_probe*"]
